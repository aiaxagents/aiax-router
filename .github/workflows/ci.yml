name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # The app UI is its own npm project; typecheck and build it too.
      - run: pnpm ui:build
      # Smoke: no vendor CLIs exist on the runner; doctor must degrade gracefully.
      - run: node dist/cli/index.js doctor
