<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AiAx Router</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #2c2e36;
        color: #e9fff5;
        font:
          15px/1.5 ui-sans-serif,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      p {
        margin: 0;
        opacity: 0.7;
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div style="text-align: center">
      <svg class="mark" viewBox="8 10 92 96" role="img" aria-label="AiAx">
        <path
          d="M51.6 24.5L18.9 94.1C17.5 97.1 21.2 99.9 23.8 97.8L48.4 78.3C50.3 76.8 53 76.8 54.9 78.4L79.1 97.9C81.7 100 85.5 97.2 84.1 94.1L51.6 24.5Z"
          fill="#66D6A6"
        />
        <path
          d="M51.4 31.4L35.4 67.5C34.6 69.3 36.6 71 38.3 70L49.2 63.6C50.7 62.7 52.6 62.7 54.1 63.6L65.3 70.2C67 71.2 69 69.4 68.1 67.6L51.4 31.4Z"
          fill="#ffffff"
        />
      </svg>
      <p>Starting up...</p>
    </div>
  </body>
</html>
